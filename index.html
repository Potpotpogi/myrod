#myImage {
    display: none;
    width: 300px;
    margin: 20px auto 0;
    border-radius: 10px;
}

#myImage.show {
    display: block;
    animation: popUp 0.8s ease-out;
}

@keyframes popUp {
    0% {
        opacity: 0;
        transform: scale(0.3) rotate(-10deg);
    }

    60% {
        opacity: 1;
        transform: scale(1.1) rotate(5deg);
    }

    100% {
        opacity: 1;
        transform: scale(1) rotate(0deg);
    }
}

    </style>
